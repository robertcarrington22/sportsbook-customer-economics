# Every number the simulator uses lives in this file.
#
# Three things are calibrated to real, public data: activity seasonality, hold,
# and month-to-month hold volatility, all from DraftKings' monthly filings with
# the New York State Gaming Commission (real_data/). New York's 51% tax rate is
# also real. Everything else (channels, CAC, offers, player types) is my
# assumption, chosen to be plausible for a US sportsbook and meant to be argued
# with. None of it is DraftKings internal data.
#
# Change a number, re-run `python run.py`, and every table, model, and chart
# downstream updates.

[simulation]
seed = 42
n_ftds = 40000                 # first-time depositors (the unit CAC is paid on)
signup_start = "2024-09-01"
signup_end = "2025-08-31"
observation_end = "2026-06-30" # every cohort gets at least ~10 months of history

# Relative signup volume by calendar month (1 = January).
[simulation.signup_seasonality]
1 = 1.3    # NFL playoffs
2 = 1.4    # Super Bowl
3 = 1.3    # March Madness
4 = 0.6
5 = 0.5
6 = 0.45
7 = 0.4
8 = 0.8    # preseason
9 = 2.2    # NFL kickoff
10 = 1.5
11 = 1.3
12 = 1.2

# Multiplier on a player's chance of betting on a given day, by calendar month.
# Taken from real data: DraftKings' monthly New York handle, Jan 2022 to Aug 2026,
# divided by a centered 12-month average to remove growth, then averaged by month.
# See real_data/parse_ny.py and real_data/ny_seasonality.csv.
[simulation.activity_seasonality]
1 = 1.131
2 = 0.952
3 = 1.116
4 = 1.025
5 = 1.041
6 = 0.816
7 = 0.623
8 = 0.725
9 = 1.126
10 = 1.184
11 = 1.146
12 = 1.114

[economics]
# Payments, data feeds, trading/risk, platform fees, as a share of handle.
variable_cost_pct_handle = 0.006
# Month-to-month swing in hold shared by every player, because everyone bets
# on the same games. DraftKings' monthly NY hold, Sep 2024 to Aug 2026, has a
# standard deviation of 1.64 points (range 5.3% to 11.5%). Bet outcomes alone
# produce about 0.63 points in the simulation, so the shared shock supplies the
# rest: sqrt(1.64^2 - 0.63^2) = 1.51 points.
market_hold_sd = 0.0151

# ---------------------------------------------------------------------------
# Acquisition channels. `cac` is the blended cost per FTD. `type_mix` is the
# hidden share of each player type the channel brings in. The analysis never
# sees player type; it only sees behavior.
# ---------------------------------------------------------------------------
[channels.paid_social]
share = 0.28
cac = 310
type_mix = { bonus_hunter = 0.22, casual = 0.50, regular = 0.22, high_value = 0.06 }

[channels.search]
share = 0.20
cac = 390
type_mix = { bonus_hunter = 0.12, casual = 0.42, regular = 0.34, high_value = 0.12 }

[channels.affiliate]
share = 0.22
cac = 450
type_mix = { bonus_hunter = 0.30, casual = 0.30, regular = 0.28, high_value = 0.12 }

[channels.tv_brand]
share = 0.18
cac = 220
type_mix = { bonus_hunter = 0.08, casual = 0.52, regular = 0.32, high_value = 0.08 }

[channels.referral]
share = 0.12
cac = 160
type_mix = { bonus_hunter = 0.10, casual = 0.38, regular = 0.40, high_value = 0.12 }

# ---------------------------------------------------------------------------
# Welcome offers. `expected_cost` is the operator's expected cost of the offer
# per FTD. `type_tilt` multiplies the channel's type mix (then renormalized):
# rich no-strings offers pull in more bonus hunters.
# ---------------------------------------------------------------------------
[offers.bet5_get200]
share = 0.50
expected_cost = 150
type_tilt = { bonus_hunter = 1.6 }

[offers.no_sweat_1000]
share = 0.30
expected_cost = 95
type_tilt = { high_value = 1.4, regular = 1.1 }

[offers.deposit_match_250]
share = 0.20
expected_cost = 70
type_tilt = { casual = 1.1 }

# ---------------------------------------------------------------------------
# States. Tax is applied to net gaming revenue (GGR minus promos) as a
# simplification. Rates are illustrative approximations; several states use
# tiered or per-wager structures that this ignores.
# ---------------------------------------------------------------------------
[states]
NY = { share = 0.20, tax_rate = 0.51 }
NJ = { share = 0.12, tax_rate = 0.1975 }
PA = { share = 0.12, tax_rate = 0.36 }
IL = { share = 0.12, tax_rate = 0.25 }
MA = { share = 0.08, tax_rate = 0.20 }
OH = { share = 0.10, tax_rate = 0.20 }
MI = { share = 0.08, tax_rate = 0.084 }
AZ = { share = 0.08, tax_rate = 0.10 }
CO = { share = 0.10, tax_rate = 0.10 }

# ---------------------------------------------------------------------------
# Bet types. Hold per bet type is 1 - win_prob * decimal_odds: about 5% on
# straight and live bets, 16% on parlays, 22% on same-game parlays (SGP).
# stake_mult scales a player's usual stake for that bet type (parlays are
# usually smaller). Player-type mixes below are tuned so blended hold lands
# near DraftKings' real New York hold (9.1%).
# ---------------------------------------------------------------------------
[bet_types.straight]
win_prob = 0.497
decimal_odds = 1.91
stake_mult = 1.0

[bet_types.live]
win_prob = 0.49
decimal_odds = 1.93
stake_mult = 0.8

[bet_types.parlay]
win_prob = 0.20
decimal_odds = 4.2
stake_mult = 0.75

[bet_types.sgp]
win_prob = 0.12
decimal_odds = 6.5
stake_mult = 0.6

# Each player's bet-type mix is drawn around their type's mix with this
# Dirichlet concentration (higher = players of a type look more alike).
[gameplay]
mix_concentration = 15
# Player-level spread in sport preference (lognormal sigma).
sport_affinity_sigma = 0.5
# How strongly a player's activity follows the seasons of the sports they
# like (0 = not at all, 1 = fully). Applied on top of the market seasonality.
sport_season_strength = 0.5

# ---------------------------------------------------------------------------
# Sports. `season` is the relative weight of each sport by calendar month
# (1 = January). Unlisted months are 0.
# ---------------------------------------------------------------------------
[sports.nfl]
season = { 1 = 0.9, 2 = 0.4, 9 = 1.0, 10 = 1.0, 11 = 1.0, 12 = 1.0 }
[sports.college_football]
season = { 1 = 0.3, 9 = 0.6, 10 = 0.6, 11 = 0.6, 12 = 0.5 }
[sports.nba]
season = { 1 = 0.8, 2 = 0.8, 3 = 0.8, 4 = 0.9, 5 = 1.0, 6 = 0.8, 10 = 0.6, 11 = 0.7, 12 = 0.7 }
[sports.college_basketball]
season = { 1 = 0.3, 2 = 0.3, 3 = 1.2, 4 = 0.2, 11 = 0.2, 12 = 0.3 }
[sports.mlb]
season = { 3 = 0.2, 4 = 1.0, 5 = 1.0, 6 = 1.0, 7 = 1.0, 8 = 1.0, 9 = 0.7, 10 = 0.5 }
[sports.nhl]
season = { 1 = 0.3, 2 = 0.3, 3 = 0.3, 4 = 0.3, 5 = 0.4, 6 = 0.4, 10 = 0.3, 11 = 0.3, 12 = 0.3 }
[sports.soccer]
season = { 1 = 0.25, 2 = 0.25, 3 = 0.25, 4 = 0.25, 5 = 0.3, 6 = 0.35, 7 = 0.35, 8 = 0.25, 9 = 0.25, 10 = 0.25, 11 = 0.25, 12 = 0.25 }
[sports.other]
season = { 1 = 0.2, 2 = 0.2, 3 = 0.2, 4 = 0.2, 5 = 0.2, 6 = 0.2, 7 = 0.2, 8 = 0.2, 9 = 0.2, 10 = 0.2, 11 = 0.2, 12 = 0.2 }

# ---------------------------------------------------------------------------
# Hidden player types. Behavior parameters:
#   early_exit_prob  chance the player is gone within 30 days
#   monthly_churn    churn hazard after the first month
#   p_active         base chance of betting on any given day while retained
#   bets_per_day     mean bets on an active day
#   stake_median     median stake per bet ($); stake_sigma is player-level spread
#   bet_mix          average share of bets by bet type
#   sport_affinity   relative preference by sport (unlisted = 1.0)
#   reinvest_pct     ongoing promos (boosts, bonus bets) as a share of expected GGR
#   promo_use        how much of the welcome offer's expected cost they extract
# ---------------------------------------------------------------------------
[types.bonus_hunter]
early_exit_prob = 0.65
monthly_churn = 0.20
p_active = 0.10
bets_per_day = 1.5
stake_median = 10
stake_sigma = 0.6
bet_mix = { straight = 0.75, live = 0.10, parlay = 0.15, sgp = 0.0 }
sport_affinity = { nfl = 1.3 }
reinvest_pct = 0.05
promo_use = 1.15

[types.casual]
early_exit_prob = 0.35
monthly_churn = 0.14
p_active = 0.07
bets_per_day = 2.0
stake_median = 15
stake_sigma = 0.8
bet_mix = { straight = 0.20, live = 0.05, parlay = 0.40, sgp = 0.35 }
sport_affinity = { nfl = 2.2, college_football = 1.4, college_basketball = 1.5, nba = 0.7, mlb = 0.4, nhl = 0.4, soccer = 0.5, other = 0.5 }
reinvest_pct = 0.10
promo_use = 0.80

[types.regular]
early_exit_prob = 0.12
monthly_churn = 0.07
p_active = 0.22
bets_per_day = 3.5
stake_median = 30
stake_sigma = 0.8
bet_mix = { straight = 0.36, live = 0.14, parlay = 0.29, sgp = 0.21 }
sport_affinity = { nfl = 1.3 }
reinvest_pct = 0.15
promo_use = 1.00

[types.high_value]
early_exit_prob = 0.05
monthly_churn = 0.035
p_active = 0.40
bets_per_day = 6.0
stake_median = 100
stake_sigma = 1.0
bet_mix = { straight = 0.40, live = 0.23, parlay = 0.22, sgp = 0.15 }
sport_affinity = { nba = 1.3, mlb = 1.4, nhl = 1.1, soccer = 1.2, other = 1.2, college_football = 0.8 }
